<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>길은 막힘없이 거리는 빈틈없이 안성맞춤 ai</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f2ec;--card:#fff;--ink:#2b2a26;--mute:#6f6c62;--line:#dcd8cb;--accent:#6b685a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1a17;--card:#25241f;--ink:#efece3;--mute:#a9a595;--line:#3a382f;--accent:#c9c4ae}}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:var(--bg);color:var(--ink);line-height:1.7;word-break:keep-all}
/* hero */
.hero{position:relative;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff;padding:60px 24px}
.bg{position:fixed;inset:0;z-index:-1;background-size:cover;background-position:center;will-change:opacity,transform;pointer-events:none}
#bgRoad::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.42),rgba(0,0,0,.55))}
.hero>*{position:relative;z-index:1}
.mark{display:block;height:108px;width:auto;margin-bottom:16px;filter:drop-shadow(0 4px 14px rgba(0,0,0,.3))}
.brand{font-size:13px;letter-spacing:.35em;margin-bottom:34px;opacity:.9}
.hero h1{font-size:clamp(28px,4.4vw,52px);font-weight:500;line-height:1.35;letter-spacing:-.01em;text-shadow:0 2px 16px rgba(0,0,0,.3)}
.hero hr{width:48px;border:0;border-top:2px solid #fff;margin:26px auto}
.hero p{font-size:clamp(14px,1.4vw,17px);font-weight:300;margin-bottom:26px}
.pill{display:inline-block;padding:11px 30px;border:1px solid rgba(255,255,255,.85);border-radius:999px;color:#fff;text-decoration:none;font-size:14px;transition:background .3s,color .3s}
.pill:hover,.pill:focus-visible{background:#fff;color:#3a382f}
.cue{position:absolute;bottom:calc(22px + env(safe-area-inset-bottom,0px));left:50%;width:1px;height:38px;background:linear-gradient(#fff,transparent);transform:translateX(-50%)}
/* sections */
section.s{max-width:1080px;margin:0 auto;padding:96px 24px 40px}
.eyebrow{font-size:12px;letter-spacing:.2em;color:var(--mute);margin-bottom:10px}
h2.sec{font-size:clamp(24px,3vw,34px);font-weight:700;line-height:1.35;margin-bottom:40px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}
.card{background:var(--card);border:1px solid var(--line);padding:34px 30px}
.card .tag{display:inline-block;font-size:12px;color:var(--accent);border:1px solid var(--line);padding:2px 10px;margin-bottom:14px}
.card h3{font-size:21px;font-weight:700;margin-bottom:10px}
.card p{color:var(--mute);font-size:15px}
.card ul{list-style:none;margin:16px 0 22px}
.card li{padding:9px 0;border-top:1px solid var(--line);font-size:15px}
.card li::before{content:"—";margin-right:10px;color:var(--accent)}
.card a{color:var(--ink);font-weight:500;text-decoration:none;border-bottom:1px solid var(--ink)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;margin-bottom:20px}
.stat{background:var(--card);border:1px solid var(--line);padding:28px 26px}
.stat small{font-size:12px;color:var(--mute);letter-spacing:.08em}
.stat b{display:block;font-size:30px;line-height:1.3;margin:6px 0 8px}
.stat span{font-size:14px;color:var(--mute)}
.sub{font-size:18px;font-weight:700;margin:48px 0 16px}
.flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:0;border:1px solid var(--line);background:var(--card)}
.flow div{padding:22px 20px;border-right:1px solid var(--line);font-size:14px;color:var(--mute)}
.flow div:last-child{border-right:0}
.flow b{display:block;color:var(--ink);font-size:16px;margin-bottom:6px}
ol.rec{padding-left:22px;font-size:15px}
ol.rec li{padding:6px 0}
ol.rec b{font-weight:500}
.note{background:var(--card);border-left:3px solid var(--accent);padding:18px 22px;font-size:14px;color:var(--mute)}
.note li{margin-left:18px}
.refs{font-size:13px;color:var(--mute);margin-top:12px}
.refs li{margin-left:18px;padding:3px 0}
footer{text-align:center;font-size:12px;color:var(--mute);padding:56px 16px calc(40px + env(safe-area-inset-bottom,0px))}
.bar{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:calc(18px + env(safe-area-inset-top,0px)) 24px 0}
.logo{display:block;filter:drop-shadow(0 0 2px rgba(255,255,255,.95)) drop-shadow(0 0 7px rgba(255,255,255,.65))}
.logo img{display:block;height:96px;width:auto}
.acts{display:flex;gap:10px;padding-top:6px}
.abtn{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 20px;border:1px solid rgba(255,255,255,.7);border-radius:999px;background:rgba(255,255,255,.16);color:#fff;font:500 14px/1 'Noto Sans KR',sans-serif;cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 4px 16px rgba(0,0,0,.18);transition:background .25s,color .25s}
.abtn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.abtn:hover,.abtn:focus-visible{background:#fff;color:#2b2a26}
@media (max-width:560px){.bar{padding-left:14px;padding-right:14px}.logo img{height:68px}.logo{display:block;filter:drop-shadow(0 0 2px rgba(255,255,255,.95)) drop-shadow(0 0 7px rgba(255,255,255,.65))}.abtn{height:38px;padding:0 14px;font-size:13px}.abtn svg{display:none}}

</style>
</head>

/* =========================================================
   3) 훅 — 스크롤에 따라 배경 전환 (원본 스크립트와 동일한 동작)
   ========================================================= */
function useScrollBackground(roadRef, mapRef) {
  useEffect(() => {
    const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const update = () => {
      const road = roadRef.current, map = mapRef.current;
      if (!road || !map) return;
      const p = Math.min(Math.max(window.scrollY / (window.innerHeight * 0.85), 0), 1);
      road.style.opacity = 1 - p;
      map.style.opacity = (p * 0.2).toFixed(3);
      if (!reduce) road.style.transform = "scale(" + (1 + 0.06 * p).toFixed(3) + ")";
    };
    window.addEventListener("scroll", update, { passive: true });
    window.addEventListener("resize", update);
    update();
    return () => {
      window.removeEventListener("scroll", update);
      window.removeEventListener("resize", update);
    };
  }, []);
}

/* =========================================================
   4) 공용 컴포넌트
   ========================================================= */
// ["첫 줄", "둘째 줄"] → 첫 줄<br>둘째 줄
function Lines({ lines }) {
  return lines.map((line, i) => (
    <React.Fragment key={i}>{i > 0 && <br />}{line}</React.Fragment>
  ));
}

function Section({ id, eyebrow, title, children }) {
  return (
    <section className="s" id={id}>
      <div className="eyebrow">{eyebrow}</div>
      <h2 className="sec"><Lines lines={title} /></h2>
      {children}
    </section>
  );
}

function SubTitle({ children }) {
  return <h3 className="sub">{children}</h3>;
}

}

function InfoCard({ card }) {

    <article className="card">
      {card.tag && <div className="tag">{card.tag}</div>}

function InfoSection({ data }) {

function EvidenceSection({ data }) {

          <div className="stat" key={s.label}>

      <SubTitle>{data.refTitle}</SubTitle>
      <ul className="refs">{data.refs.map(t => <li key={t}>{t}</li>)}</ul>
    </Section>
  );
}

function Footer({ text }) {
